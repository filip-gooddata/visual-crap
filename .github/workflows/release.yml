name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        shell: bash
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log --format=%B "$last..HEAD")
            if grep -q '#major' <<< "$log"; then next="v$((major + 1)).0.0"
            elif grep -q '#minor' <<< "$log"; then next="v$major.$((minor + 1)).0"
            else next="v$major.$minor.$((patch + 1))"; fi
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test graph analysis and force controls
        run: |
          node tests/forces.cjs
          node tests/adaptive.mjs
          npm install --prefix /tmp/visual-crap-test typescript@5.9.3 --no-save --no-package-lock
          TYPESCRIPT_DIR=/tmp/visual-crap-test/node_modules/typescript node tests/relationships.cjs
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: ./build.sh
      - name: Test community layout
        run: |
          .venv/bin/python tests/test_communities.py
          .venv/bin/python tests/test_env.py
      - name: Test executable
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$ARCH"
          test "$(./dist/visual-crap --version)" = "visual-crap $VERSION"
          TYPESCRIPT_DIR=/tmp/visual-crap-test/node_modules/typescript python tests/smoke.py ./dist/visual-crap
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          OS: ${{ matrix.os }}
        run: |
          name="visual-crap-$VERSION-$OS-$ARCH"
          tar -czf "$name.tar.gz" -C dist visual-crap
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: visual-crap-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
